name: Check Image Upload Gateway changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare container-style test mounts
        run: sudo mkdir -p /config /fallback/work /fallback/personal /fallback/portals && sudo chown -R "$USER":"$USER" /config /fallback
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py secure_app.py updater_service.py tests
      - name: Gateway tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install camera queue test dependencies
        run: npm ci --ignore-scripts
      - name: Camera queue recovery and retry tests
        run: npm test
      - name: Validate Compose
        env:
          ADMIN_PASSWORD: test-only
          SESSION_SECRET: test-session-secret
          APP_HOST_PATH: .
        run: docker compose config >/dev/null
