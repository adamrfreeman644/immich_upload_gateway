name: Check Image Upload Gateway changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare container-style test mounts
        run: sudo mkdir -p /config /fallback/work /fallback/personal && sudo chown -R "$USER":"$USER" /config /fallback
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py secure_app.py tests
      - name: Public upload test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          pytest -q tests/test_auth_boundaries.py::test_valid_public_upload_page_never_requires_authentik > /tmp/gateway-test.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            printf 'Temporary CI diagnostic for public upload test:\n\n```text\n' >/tmp/comment.txt
            cat /tmp/gateway-test.log >>/tmp/comment.txt
            printf '\n```\n' >>/tmp/comment.txt
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.txt
          fi
          cat /tmp/gateway-test.log
          exit "$code"
      - name: Public cannot access admin test
        run: pytest -q tests/test_auth_boundaries.py::test_public_uploader_cannot_open_admin
      - name: Portal isolation test
        run: pytest -q tests/test_auth_boundaries.py::test_public_token_does_not_browse_other_portal
      - name: Auth outage isolation test
        run: pytest -q tests/test_auth_boundaries.py::test_admin_auth_misconfiguration_fails_closed_but_public_stays_up
      - name: Authenticated admin test
        run: pytest -q tests/test_auth_boundaries.py::test_authenticated_admin_session_succeeds
      - name: Invalid OIDC rejection test
        run: pytest -q tests/test_auth_boundaries.py::test_invalid_or_expired_oidc_exchange_is_rejected
      - name: Health secrecy test
        run: pytest -q tests/test_auth_boundaries.py::test_health_never_exposes_secrets
      - name: Validate Compose
        env:
          ADMIN_PASSWORD: test-only
          SESSION_SECRET: test-session-secret
        run: docker compose config >/dev/null
