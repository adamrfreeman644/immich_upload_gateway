services:
  ad53-shared-updater:
    container_name: ad53-shared-updater
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      UPDATER_PORT: "${UPDATER_PORT:-8093}"
      UPDATER_CONFIG: /config/apps.json
      UPDATER_STATE_DIR: /state
      DEFAULT_APP_ID: "${DEFAULT_APP_ID:-immich-gateway}"
    volumes:
      - "${UPDATER_CONFIG_HOST_PATH:-./apps.json}:/config/apps.json:ro"
      - "${UPDATER_STATE_HOST_PATH:-./state}:/state"
      - "${IMMICH_GATEWAY_APP_PATH:-/mnt/user/appdata/immich-upload-gateway}:/apps/immich-gateway"
      - "${INVENTORY_MANAGER_APP_PATH:-/mnt/user/appdata/stock-take}:/apps/inventory-manager"
      - "${RIP_MANAGER_APP_PATH:-/mnt/user/appdata/rip-manager}:/apps/rip-manager"
      - /var/run/docker.sock:/var/run/docker.sock
