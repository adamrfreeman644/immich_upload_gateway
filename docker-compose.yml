services:
  immich-upload-gateway:
    build: .
    container_name: immich-upload-gateway
    restart: unless-stopped
    ports:
      - "8092:8092"
    environment:
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-}"
      OIDC_POST_LOGOUT_REDIRECT_URI: "${OIDC_POST_LOGOUT_REDIRECT_URI:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      MAX_FILE_MB: "${MAX_FILE_MB:-5000}"
    volumes:
      - "${CONFIG_HOST_PATH:-./config}:/config"
      - "${WORK_FALLBACK_HOST_PATH:-./fallback/work}:/fallback/work"
      - "${PERSONAL_FALLBACK_HOST_PATH:-./fallback/personal}:/fallback/personal"
